# LinuxCNC 2.9 configuration: 3-axis gantry mill, two motors on Y (XYYZ),
# real-time board "cncboard" over SPI.
#
# The travel limits, homing directions/velocities and SCALE values below are
# placeholders. Set them for your machine before the first move.

[EMC]
MACHINE = fraese-xyyz
VERSION = 1.1
DEBUG = 0

[DISPLAY]
DISPLAY = axis
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 1.2
DEFAULT_LINEAR_VELOCITY = 20
MAX_LINEAR_VELOCITY = 100
INCREMENTS = 10mm 1mm 0.1mm 0.01mm
PROGRAM_PREFIX = ~/linuxcnc/nc_files
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 2

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = fraese.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[HAL]
HALFILE = fraese.hal

[KINS]
JOINTS = 4
KINEMATICS = trivkins coordinates=XYYZ kinstype=BOTH

[TRAJ]
COORDINATES = XYYZ
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
MAX_LINEAR_VELOCITY = 100
DEFAULT_LINEAR_VELOCITY = 20

# SCALE = steps per mm = pulses per motor revolution / ball screw pitch.
# 4000 pulses/rev (electronic gear of the servo drive) / 5 mm = 800.
# 100 mm/s * 800 = 80 kHz, the board can do 125 kHz. Keep MAX_VELOCITY * SCALE
# below that, otherwise the board falls behind and LinuxCNC stops with a
# following error.

# ---------------- X ----------------
[AXIS_X]
MIN_LIMIT = 0
MAX_LIMIT = 700
MAX_VELOCITY = 100
MAX_ACCELERATION = 1000

[JOINT_0]
TYPE = LINEAR
SCALE = 800
MIN_LIMIT = 0
MAX_LIMIT = 700
MAX_VELOCITY = 100
MAX_ACCELERATION = 1000
FERROR = 0.5
MIN_FERROR = 0.05
HOME = 5
HOME_OFFSET = 0
HOME_SEARCH_VEL = -20
HOME_LATCH_VEL = -2
HOME_SEQUENCE = 1

# ---------------- Y (two joints, homed together) ----------------
[AXIS_Y]
MIN_LIMIT = 0
MAX_LIMIT = 700
MAX_VELOCITY = 100
MAX_ACCELERATION = 1000

[JOINT_1]
TYPE = LINEAR
SCALE = 800
MIN_LIMIT = 0
MAX_LIMIT = 700
MAX_VELOCITY = 100
MAX_ACCELERATION = 1000
FERROR = 0.5
MIN_FERROR = 0.05
HOME = 5
HOME_OFFSET = 0
HOME_SEARCH_VEL = -20
HOME_LATCH_VEL = -2
HOME_SEQUENCE = -2

[JOINT_2]
TYPE = LINEAR
# If the second Y motor is mounted mirrored, use SCALE = -800.
SCALE = 800
MIN_LIMIT = 0
MAX_LIMIT = 700
MAX_VELOCITY = 100
MAX_ACCELERATION = 1000
FERROR = 0.5
MIN_FERROR = 0.05
HOME = 5
# Squaring the gantry: change HOME_OFFSET of one Y joint by the measured error.
HOME_OFFSET = 0
HOME_SEARCH_VEL = -20
HOME_LATCH_VEL = -2
HOME_SEQUENCE = -2

# ---------------- Z (home switch at the top, homes first) ----------------
[AXIS_Z]
MIN_LIMIT = -130
MAX_LIMIT = 0
MAX_VELOCITY = 50
MAX_ACCELERATION = 500

[JOINT_3]
TYPE = LINEAR
SCALE = 800
MIN_LIMIT = -130
MAX_LIMIT = 0
MAX_VELOCITY = 50
MAX_ACCELERATION = 500
FERROR = 0.5
MIN_FERROR = 0.05
HOME = -5
HOME_OFFSET = 0
HOME_SEARCH_VEL = 10
HOME_LATCH_VEL = 1
HOME_SEQUENCE = 0
